name: release

# v から始まるタグ（例：v0.1.0）を push すると、ビルド→テスト→インストーラ作成
# →その GitHub Release へ添付、まで一括で行う。
# windows-latest ランナーには Inno Setup 6（iscc）が標準で入っているので、
# 追加のインストール手順は無い（croco-editor 本体のビルドが csc.exe のみで
# 完結する方針と同じく、CI 側も新規ツールチェーンを増やさない）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: フロントの依存関係をインストール
        run: npm install

      - name: 回帰テスト（字数・下線・変換）
        run: npm test

      - name: C# 殻をビルド（csc.exe のみ、.NET SDK 不要）
        run: node csharp/build_host.mjs

      - name: インストーラをビルド（Inno Setup）
        run: iscc installer\croco-editor.iss

      - name: Release へ添付
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
          generate_release_notes: true
