<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>croco-editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="tabs"></div>
    <div id="toolbar">
      <!-- Labels are filled in by main.js (applyStaticText) in the UI language -->
      <label><span id="lbl-limit"></span> <input type="number" id="limit" value="0" min="0" step="100" /> <span id="lbl-unit"></span></label>
      <span id="presets"></span>
      <label><input type="checkbox" id="ws" checked /> <span id="lbl-ws"></span></label>
      <label><input type="checkbox" id="strip" /> <span id="lbl-strip"></span></label>
    </div>
    <div id="split">
      <div id="editor"></div>
      <div id="gutter1" class="gutter hidden"></div>
      <div id="preview"></div>
      <div id="gutter2" class="gutter hidden"></div>
      <div id="memo" class="hidden"></div>
      <div id="empty" class="hidden"></div>
    </div>
    <div id="statusbar">
      <span id="count"></span>
      <span id="pos"></span>
      <span id="pt">11 pt</span>
      <span id="path"></span>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
